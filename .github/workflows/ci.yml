# Typecheck and the two self-check suites on every push and pull request. The suites run with the
# test LLM provider (DEVCTX_FAKE_LLM) and never call a real AI CLI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm run bench:memory
        env:
          DEVCTX_OFFLINE: '1'
      - run: npm run bench:codeindex
